<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornerstone DICOM Viewer</title>

    <!-- Enlace al CSS externo -->
    <link rel="stylesheet" href="./visorLayout.css" />
  </head>

  <body>
    <!-- Barra lateral única (izquierda) -->
    <div class="sidebar">
      <img id="logo" src="./imagenes/logo_AT.png" alt="Logo" />

      <!-- Sección de visualización -->
      <h3>Visualización</h3>
      <div class="button-grid">
        <button id="zoomBtn">Zoom</button>
        <button id="panBtn">Pan</button>
        <button id="windowBtn">W/L</button>
        <button id="crosshairBtn">Crosshair</button>
        <button id="rotateBtn">Rotate</button>
        <button id="invertBtn">Invert</button>
      </div>

      <!-- Separador visual -->
      <hr class="divider" />

      <!-- Sección de anotación -->
      <h3>Anotación</h3>
      <div class="button-grid">
        <button id="measureBtn">Length</button>
        <button id="ellipseBtn">Elliptical ROI</button>
        <button id="pointBtn">Point</button>
        <button id="freehandBtn">Freehand ROI</button>
        <button id="rectBtn">Rectangle ROI</button>
        <button id="arrowBtn">Arrow</button>
      </div>
    </div>

    <!-- Contenedor del visor -->
    <div id="dicomContainer">
      <div id="header">Visor DICOM - Mamografía</div>
      <div id="dicomViewer">
        <div id="dicomImage"></div>
      </div>
    </div>

    <!-- Cargar script principal del visor -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const script = document.createElement("script");
        script.src = "../dist/bundle.js";
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
